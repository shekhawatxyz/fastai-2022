<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555">
<rect width="1000" height="555" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17212d;font-size:15px}.h{font-size:21px;font-weight:bold}.small{font-size:13px}.b{fill:#f3f5f7;stroke:#536477;stroke-width:1.3;rx:5}.new{fill:#e9f5f1;stroke:#286c5a;stroke-width:1.5;rx:5}.fail{fill:#fff2e9;stroke:#ae642e;stroke-width:1.3;rx:5}.arrow{fill:none;stroke:#536477;stroke-width:1.6;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#536477"/></marker></defs>
<text class="h" x="25" y="33">E1: failed executor</text><text class="h" x="345" y="33">E2–E4: tested pieces</text><text class="h" x="680" y="33">Target: proposed system</text>
<g text-anchor="middle">
<rect class="b" x="25" y="58" width="270" height="48"/><text x="160" y="87">Frames + action</text><path class="arrow" d="M160 106V135"/>
<rect class="b" x="25" y="135" width="270" height="48"/><text x="160" y="164">Convolutional encoder</text><path class="arrow" d="M160 183V212"/>
<rect class="fail" x="25" y="212" width="270" height="70"/><text x="160" y="236">Soft label slots → copy/write</text><text class="small" x="160" y="258">Three recurrent passes; forced execution</text><path class="arrow" d="M160 282V310"/>
<rect class="fail" x="25" y="310" width="270" height="60"/><text x="160" y="335">Prediction</text><text class="small" x="160" y="354">Low accuracy; labels lacked semantics</text>
<rect class="b" x="345" y="58" width="285" height="48"/><text x="487" y="87">WARC + direct adapter</text><path class="arrow" d="M487 106V135"/>
<rect class="new" x="345" y="135" width="285" height="60"/><text x="487" y="159">E2: abstaining residual rules</text><text class="small" x="487" y="179">Real ARC gain not measured</text>
<rect class="new" x="345" y="224" width="285" height="60"/><text x="487" y="248">E3: joint rewrite prior</text><text class="small" x="487" y="268">Synthetic transfer; fixed bank</text><path class="arrow" d="M487 284V310"/>
<rect class="fail" x="345" y="310" width="285" height="60"/><text x="487" y="334">E4: hard context allocation</text><text class="small" x="487" y="354">Faster return, no overall win</text>
<rect class="b" x="680" y="58" width="295" height="48"/><text x="827" y="87">Neural proposal + fallback</text><path class="arrow" d="M827 106V135"/>
<rect class="new" x="680" y="135" width="295" height="60"/><text x="827" y="159">Typed program search + library</text><text class="small" x="827" y="179">Learn macros, guards, transformations</text><path class="arrow" d="M827 195V224"/>
<rect class="new" x="680" y="224" width="295" height="60"/><text x="827" y="248">Execute, compare, abstain</text><text class="small" x="827" y="268">Prediction before next outcome</text><path class="arrow" d="M827 284V310"/>
<rect class="new" x="680" y="310" width="295" height="60"/><text x="827" y="334">Observe and revise dependencies</text><text class="small" x="827" y="354">Retain old versions, counterexamples</text><path class="arrow" d="M827 370V399"/>
<rect class="new" x="680" y="399" width="295" height="60"/><text x="827" y="423">Learn revision / search operators</text><text class="small" x="827" y="443">Feed them into future acquisition</text><path class="arrow" d="M975 429H990V165H975"/>
</g><text x="25" y="510" class="small">Gray = established neural component. Green = tested limited mechanism or proposed extension (see column).</text><text x="25" y="533" class="small">Orange = failed or insufficient mechanism. Right column is a design contract, not an implemented system.</text></svg>